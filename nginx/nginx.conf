# Loaded inside the existing Ubuntu Nginx http block, through sites-enabled.
# HTTPS is terminated by the existing hospital proxy. Preserve its scheme.
map $http_x_forwarded_proto $pharmcare_scheme {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:__HTTP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pharmcare_scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
