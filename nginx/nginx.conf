events {}
http {
  # Redirect HTTP to HTTPS
  server {
    listen 80;
    server_name phramcare.kkh.go.th localhost;
    return 301 https://$host$request_uri;
  }
  # HTTPS Server
  server {
    listen 443 ssl;
    server_name phramcare.kkh.go.th localhost;

    # SSL Configuration
    ssl_certificate /etc/nginx/certs/phramcare.kkh.go.th.crt;
    ssl_certificate_key /etc/nginx/certs/phramcare.kkh.go.th.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    # API Routes
    location /api/ {
      proxy_pass http://backend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;

      # Timeout settings
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }
    # Frontend (serve static files directly)
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;

      # Cache static assets
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }

      # Security for HTML files
      location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
      }
    }
  }
}
