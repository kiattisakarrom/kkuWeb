version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - app-network

  frontend:
    image: kiattisakarro/unitdose-frontend:latest
    container_name: frontend-supreme
    expose:
      - "80"
    restart: always
    networks:
      - app-network

  backend:
    image: kiattisakarro/unitdose-backend:latest
    container_name: backend-supreme
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
