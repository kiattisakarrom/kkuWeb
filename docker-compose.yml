name: pharmcare

services:
  backend:
    image: pharmcare-backend:${APP_VERSION:-local}
    build: ./back
    env_file:
      - ${BACKEND_ENV_FILE:-./back/.env}
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: Asia/Bangkok
      CHECKOUT_DRUG_IMAGE_DIR: /app/drug-images
    volumes:
      - type: bind
        source: ${DRUG_IMAGE_HOST_DIR:-./back/assets/checkout-drugs}
        target: /app/drug-images
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "3000"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: pharmcare-frontend:${APP_VERSION:-local}
    build: ./front
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
